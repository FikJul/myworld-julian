<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fantasy RPG Village - 2D Worldbuilding Idle Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --screen-w: 800px;
      --screen-h: 600px;
      --world-w: 2400px;
      --ground-h: 120px;
      --hud-green: #9dff6b;
      --pixel-border: #1f1f29;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, #2a2d42 0%, #151726 35%, #090a11 80%),
        #05060a;
      font-family: "VT323", monospace;
      color: #fff;
      overflow: hidden;
    }

    .cabinet {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(170deg, #252838, #111320);
      box-shadow: 0 20px 90px rgba(0, 0, 0, 0.65), inset 0 0 0 2px #3b3d53;
    }

    #game-screen {
      position: relative;
      width: var(--screen-w);
      height: var(--screen-h);
      border: 4px solid #5f647f;
      background: #101625;
      overflow: hidden;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #world-viewport {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    #world {
      position: absolute;
      width: var(--world-w);
      height: var(--screen-h);
      background:
        linear-gradient(#2f4f9c 0 55%, #5a7bc8 55% 62%, #6ca1d9 62% 100%);
    }

    #mountains {
      position: absolute;
      inset: 130px 0 var(--ground-h) 0;
      background:
        linear-gradient(145deg, transparent 40%, #465f99 40% 60%, transparent 60%) 0 100%/280px 180px repeat-x,
        linear-gradient(145deg, transparent 45%, #3d548a 45% 60%, transparent 60%) 130px 100%/320px 180px repeat-x;
      opacity: 0.75;
      pointer-events: none;
    }

    #ground {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: var(--ground-h);
      background:
        linear-gradient(#6d4f2f 0 26%, #7a5b39 26% 100%),
        repeating-linear-gradient(
          90deg,
          rgba(0, 0, 0, 0.18) 0 8px,
          rgba(255, 255, 255, 0.03) 8px 16px
        );
      border-top: 4px solid #8fcf4e;
    }

    #world-objects, #entities {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .pixel-object {
      position: absolute;
      bottom: var(--ground-h);
      image-rendering: pixelated;
      border: 2px solid var(--pixel-border);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.05);
    }

    .house {
      width: 80px;
      height: 70px;
      background:
        linear-gradient(#8f3f33 0 22px, #ad8e68 22px 100%);
    }

    .house::before {
      content: "";
      position: absolute;
      width: 22px; height: 34px;
      bottom: 0; left: 29px;
      background: #4e3527;
      border: 2px solid #2a1b15;
    }

    .tree {
      width: 48px;
      height: 92px;
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .tree::before {
      content: "";
      position: absolute;
      width: 14px; height: 42px;
      left: 17px; bottom: 0;
      background: #59381e;
      border: 2px solid #2a1b15;
    }

    .tree::after {
      content: "";
      position: absolute;
      width: 48px; height: 56px;
      left: 0; bottom: 34px;
      background:
        linear-gradient(#3f9143 0 40%, #4fae56 40% 100%);
      border: 2px solid #245a29;
    }

    .rock {
      width: 46px;
      height: 28px;
      background: linear-gradient(#9aa0a8, #7d8289);
    }

    .mountain-pillar {
      width: 120px;
      height: 170px;
      background: linear-gradient(#626773 0 35%, #787d89 35% 100%);
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      border: 2px solid #3f4450;
      box-shadow: none;
    }

    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      padding: 8px 10px;
      border: 2px solid #21472a;
      background: rgba(10, 20, 16, 0.6);
      color: var(--hud-green);
      font-size: 27px;
      line-height: 1;
      text-shadow: 0 0 6px rgba(132, 255, 132, 0.45);
      white-space: pre-line;
    }

    #controller {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 6;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px;
      background: rgba(11, 14, 25, 0.8);
      border-top: 2px solid #38415b;
    }

    .btn {
      min-width: 54px;
      height: 48px;
      border: 2px solid #263149;
      background: #1f2a45;
      color: #ccf0ff;
      font: inherit;
      font-size: 28px;
      cursor: pointer;
      transition: transform .08s ease;
      user-select: none;
    }

    .btn:active {
      transform: translateY(2px);
      background: #153763;
    }

    #log-box {
      position: absolute;
      right: 10px;
      bottom: 82px;
      z-index: 6;
      width: 300px;
      min-height: 120px;
      max-height: 210px;
      overflow: hidden;
      padding: 8px 10px;
      background: rgba(8, 10, 20, 0.56);
      border: 2px solid rgba(138, 155, 214, 0.55);
      color: #d4e0ff;
      font-size: 23px;
      line-height: 1.1;
    }

    .log-line {
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
      opacity: 0.95;
      margin-bottom: 2px;
    }

    .entity {
      position: absolute;
      width: 18px;
      height: 24px;
      transform: translate(-50%, -100%);
      z-index: 4;
    }

    .sprite {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 4px;
      height: 4px;
      transform: translateX(-50%);
      image-rendering: pixelated;
    }

    .wanderer .sprite {
      background: #f4c095;
      box-shadow:
        0 4px #2d1a11, 0 8px #2665b4, 4px 8px #2665b4, -4px 8px #2665b4,
        0 12px #1f3f75, 4px 12px #1f3f75, -4px 12px #1f3f75,
        0 16px #3e2d1e, 4px 16px #3e2d1e, -4px 16px #3e2d1e;
    }

    .patroller .sprite {
      background: #f7d6b5;
      box-shadow:
        0 4px #505a6e, 4px 4px #505a6e, -4px 4px #505a6e,
        0 8px #c0c7d8, 4px 8px #c0c7d8, -4px 8px #c0c7d8,
        0 12px #8e959f, 4px 12px #8e959f, -4px 12px #8e959f,
        0 16px #3b434f, 4px 16px #3b434f, -4px 16px #3b434f;
    }

    .bouncer .sprite {
      background: #87f38d;
      box-shadow:
        0 4px #5bd06a, 4px 4px #5bd06a, -4px 4px #5bd06a,
        0 8px #4cb858, 4px 8px #4cb858, -4px 8px #4cb858;
      border-radius: 1px;
    }

    .sprinter .sprite {
      background: #f7dfba;
      box-shadow:
        0 4px #e8b678, 4px 4px #e8b678, -4px 4px #e8b678,
        0 8px #8e5d29, 4px 8px #8e5d29, -4px 8px #8e5d29,
        0 12px #8e5d29, 4px 12px #8e5d29, -4px 12px #8e5d29;
    }
  </style>
</head>
<body>
  <div class="cabinet">
    <div id="game-screen">
      <div id="world-viewport">
        <div id="world">
          <div id="mountains"></div>
          <div id="world-objects"></div>
          <div id="entities"></div>
          <div id="ground"></div>
        </div>
      </div>

      <div id="hud">Map: Verdantia Plains
DAY 1</div>
      <div id="log-box"></div>

      <div id="controller">
        <button class="btn" id="btn-left" aria-label="Geser kiri">◄</button>
        <button class="btn" id="btn-action" aria-label="Aksi">◎</button>
        <button class="btn" id="btn-right" aria-label="Geser kanan">►</button>
      </div>
    </div>
  </div>

  <script>
    // ---------- Konstanta dunia ----------
    const SCREEN = { width: 800, height: 600 };
    const WORLD_WIDTH = 2400;
    const GROUND_HEIGHT = 120;
    const GROUND_Y = SCREEN.height - GROUND_HEIGHT;
    const BASELINE_UTC = Date.UTC(2026, 4, 18); // 2026-05-18

    // ---------- Elemen DOM ----------
    const worldEl = document.getElementById("world");
    const entitiesEl = document.getElementById("entities");
    const objectsEl = document.getElementById("world-objects");
    const hudEl = document.getElementById("hud");
    const logBoxEl = document.getElementById("log-box");

    // ---------- Utility ----------
    const rand = (min, max) => Math.random() * (max - min) + min;
    const randInt = (min, max) => Math.floor(rand(min, max + 1));
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

    function formatGlobalDay() {
      const now = new Date();
      const todayUTC = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      const diff = Math.floor((todayUTC - BASELINE_UTC) / 86400000);
      return Math.max(1, diff + 1);
    }

    const logState = [];
    function pushLog(text) {
      const stamp = new Date().toLocaleTimeString("id-ID", { hour12: false });
      logState.unshift(`[${stamp}] ${text}`);
      if (logState.length > 8) logState.pop();
      logBoxEl.innerHTML = logState.map((line) => `<div class="log-line">${line}</div>`).join("");
    }

    // ---------- Kamera (panning kiri/kanan) ----------
    let cameraX = 0;
    let panDirection = 0;
    const cameraSpeed = 260;
    const cameraMax = WORLD_WIDTH - SCREEN.width;

    function bindPanButton(id, direction) {
      const btn = document.getElementById(id);
      const start = () => { panDirection = direction; };
      const stop = () => { if (panDirection === direction) panDirection = 0; };
      btn.addEventListener("mousedown", start);
      btn.addEventListener("touchstart", start, { passive: true });
      btn.addEventListener("mouseup", stop);
      btn.addEventListener("mouseleave", stop);
      btn.addEventListener("touchend", stop);
      btn.addEventListener("touchcancel", stop);
    }
    bindPanButton("btn-left", -1);
    bindPanButton("btn-right", 1);

    document.getElementById("btn-action").addEventListener("click", () => {
      const pick = characters[randInt(0, characters.length - 1)];
      cameraX = clamp(pick.x - SCREEN.width / 2, 0, cameraMax);
      pushLog(`Kamera fokus ke ${pick.label}.`);
    });

    // ---------- Dekorasi dunia placeholder pixel ----------
    const worldObjects = [
      { cls: "house", x: 170 },
      { cls: "tree", x: 360 },
      { cls: "rock", x: 515 },
      { cls: "house", x: 790 },
      { cls: "mountain-pillar", x: 980 },
      { cls: "tree", x: 1240 },
      { cls: "rock", x: 1440 },
      { cls: "house", x: 1670 },
      { cls: "tree", x: 1960 },
      { cls: "mountain-pillar", x: 2200 }
    ];

    worldObjects.forEach((obj) => {
      const el = document.createElement("div");
      el.className = `pixel-object ${obj.cls}`;
      el.style.left = `${obj.x}px`;
      objectsEl.appendChild(el);
    });

    // ---------- Data karakter (extensible) ----------
    const characterDefs = [
      { id: "c1", label: "Warga Liona", role: "wanderer", x: 220, speed: 34 },
      { id: "c2", label: "Ksatria Varon", role: "patroller", x: 640, speed: 55, patrolMin: 560, patrolMax: 860 },
      { id: "c3", label: "Slime Biru", role: "bouncer", x: 1030, speed: 32 },
      { id: "c4", label: "Kucing Nox", role: "sprinter", x: 1430, speed: 180 }
    ];

    const characters = characterDefs.map((def) => ({
      ...def,
      y: GROUND_Y,
      vy: 0,
      dir: Math.random() > 0.5 ? 1 : -1,
      state: "idle",
      stateTimer: rand(1, 3),
      targetX: def.x,
      jumpTimer: rand(1.3, 2.6),
      hasLoggedMove: false,
      el: null
    }));

    function createCharacterElement(ch) {
      const el = document.createElement("div");
      el.className = `entity ${ch.role}`;
      const sprite = document.createElement("div");
      sprite.className = "sprite";
      el.appendChild(sprite);
      entitiesEl.appendChild(el);
      ch.el = el;
    }
    characters.forEach(createCharacterElement);

    // ---------- Perilaku karakter ----------
    function updateWanderer(ch, dt) {
      ch.stateTimer -= dt;
      if (ch.state === "idle" && ch.stateTimer <= 0) {
        ch.targetX = rand(80, WORLD_WIDTH - 80);
        ch.state = "move";
        ch.hasLoggedMove = false;
      }
      if (ch.state === "move") {
        if (!ch.hasLoggedMove) {
          pushLog(`${ch.label} mulai berjalan ke x:${Math.round(ch.targetX)}.`);
          ch.hasLoggedMove = true;
        }
        const dx = ch.targetX - ch.x;
        if (Math.abs(dx) < 2) {
          ch.state = "idle";
          ch.stateTimer = rand(2, 5);
          pushLog(`${ch.label} berhenti sejenak.`);
        } else {
          ch.x += Math.sign(dx) * ch.speed * dt;
          ch.dir = Math.sign(dx) || ch.dir;
        }
      }
    }

    function updatePatroller(ch, dt) {
      ch.x += ch.dir * ch.speed * dt;
      if (ch.x <= ch.patrolMin) {
        ch.x = ch.patrolMin;
        ch.dir = 1;
        pushLog(`${ch.label} berbalik arah ke kanan.`);
      } else if (ch.x >= ch.patrolMax) {
        ch.x = ch.patrolMax;
        ch.dir = -1;
        pushLog(`${ch.label} berbalik arah ke kiri.`);
      }
    }

    function updateBouncer(ch, dt) {
      ch.jumpTimer -= dt;
      if (!ch.targetX || Math.abs(ch.targetX - ch.x) < 8) {
        ch.targetX = rand(90, WORLD_WIDTH - 90);
      }

      const dx = ch.targetX - ch.x;
      if (Math.abs(dx) > 2) {
        ch.x += Math.sign(dx) * ch.speed * dt;
        ch.dir = Math.sign(dx);
      }

      // Gravitasi + lompatan slime.
      const gravity = 1200;
      if (ch.jumpTimer <= 0 && ch.y >= GROUND_Y) {
        ch.vy = -460;
        ch.jumpTimer = rand(0.8, 1.8);
        pushLog(`${ch.label} melompat!`);
      }
      ch.vy += gravity * dt;
      ch.y += ch.vy * dt;
      if (ch.y > GROUND_Y) {
        ch.y = GROUND_Y;
        ch.vy = 0;
      }
    }

    function updateSprinter(ch, dt) {
      ch.stateTimer -= dt;
      if (ch.state === "idle" && ch.stateTimer <= 0) {
        ch.state = "sprint";
        ch.targetX = rand(80, WORLD_WIDTH - 80);
        pushLog(`${ch.label} tiba-tiba sprint ke posisi baru!`);
      }
      if (ch.state === "sprint") {
        const dx = ch.targetX - ch.x;
        if (Math.abs(dx) < 6) {
          ch.state = "idle";
          ch.stateTimer = rand(6, 12);
          pushLog(`${ch.label} kembali duduk diam lama.`);
        } else {
          ch.x += Math.sign(dx) * (ch.speed + 110) * dt;
          ch.dir = Math.sign(dx) || ch.dir;
        }
      }
    }

    function updateCharacters(dt) {
      for (const ch of characters) {
        ch.y = ch.role === "bouncer" ? ch.y : GROUND_Y; // semua berdiri di atas tanah
        if (ch.role === "wanderer") updateWanderer(ch, dt);
        if (ch.role === "patroller") updatePatroller(ch, dt);
        if (ch.role === "bouncer") updateBouncer(ch, dt);
        if (ch.role === "sprinter") updateSprinter(ch, dt);
        ch.x = clamp(ch.x, 20, WORLD_WIDTH - 20);
      }
    }

    function render() {
      worldEl.style.transform = `translateX(${-cameraX}px)`;
      for (const ch of characters) {
        ch.el.style.left = `${ch.x}px`;
        ch.el.style.top = `${ch.y}px`;
        ch.el.style.scale = `${ch.dir < 0 ? -1 : 1} 1`;
      }
    }

    // ---------- Game Loop ----------
    let last = performance.now();
    function gameLoop(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      cameraX = clamp(cameraX + panDirection * cameraSpeed * dt, 0, cameraMax);
      updateCharacters(dt);
      render();
      requestAnimationFrame(gameLoop);
    }

    // ---------- Init ----------
    const day = formatGlobalDay();
    hudEl.textContent = `Map: Verdantia Plains\nDAY ${day}`;
    pushLog("Simulasi desa dimulai.");
    pushLog(`Global Day sinkron dengan kalender nyata: DAY ${day}.`);
    pushLog("Gunakan tombol ◄ ► untuk geser kamera.");
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
